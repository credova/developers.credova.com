# Task runner for the developers docs site (Docusaurus).
# Run tasks with `mise run <task>`, e.g. `mise run build`.
[tools]
node = "22"
# Pinned for reproducible CI. Bump deliberately rather than tracking "latest".
# 1.4.0+ is required for the nested overrides in package.json (lockfileVersion 3).
bun = "1.4.2"

[tasks.build]
description = "Install deps (+ sharp for image processing) and build the Docusaurus site"
run = [
  "bun install",
  "bun add sharp",
  "bun run build",
]

[tasks.typecheck]
run = "bun run typecheck"

[tasks.release]
description = "semantic-release: version, changelog, GitHub release (site deploy is handled by Vercel)"
run = [
  "bun install",
  "bun run release",
]
