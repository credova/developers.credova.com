---
name: Pull Request

on:
  pull_request:
    branches: [master]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: credova/platform-workflows/.github/workflows/node-pull-request.yaml@master
    secrets: inherit
    with:
      container: false
      # compliance + security run built-in; the Docusaurus build is validated here.
      test-command: mise run build
