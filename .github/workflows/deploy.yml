---
name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Token for semantic-release, which pushes the version + CHANGELOG commit back to
      # master via @semantic-release/git. Uses the fxt-semantic-release GitHub App, whose
      # installation includes public repos — unlike the RELEASE_DOWNLOADER org secrets,
      # which are private-visibility and resolve empty in this public repo (that mismatch
      # is what broke the deploy). RELEASE_DOWNLOADER is for downloading releases from
      # private repos; this repo only needs write access to itself.
      - id: release-token
        name: Generate release token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true

      # semantic-release: versioning, changelog, and GitHub release. The actual site
      # deploy to developers.credova.com is handled by Vercel's GitHub integration.
      - name: Release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
