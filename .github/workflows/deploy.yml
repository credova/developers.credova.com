---
name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # credova-standard release token (RELEASE_DOWNLOADER GitHub App), replacing the
      # bespoke cross-repo create-github-app-token (publicsq/developers.publicsquare.com).
      - id: release-token
        name: Generate release token
        uses: credova/platform-workflows/actions/auth-release-token@master
        with:
          client-id: ${{ secrets.RELEASE_DOWNLOADER_APP_ID }}
          private-key: ${{ secrets.RELEASE_DOWNLOADER_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true

      # semantic-release: versioning, changelog, and GitHub release. The actual site
      # deploy to developers.credova.com is handled by Vercel's GitHub integration.
      - name: Release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
